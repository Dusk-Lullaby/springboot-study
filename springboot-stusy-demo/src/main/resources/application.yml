server:
  port: 8082  #修改项目的端口号

#定义字符串数据的时候 是不需要双引号的
name: lisi
age: 12

#定义复杂数据类型
#定义对象 第一种方式
animal:
  name: dahuang
  age: 2

#定义对象 第二种写法
animal2: {name: xiaohuang, age: 2}

#数组 List set 方式一
pets:
  - cat
  - dog
  - fish

#数组 List set 方式二
pets2: [cat,dog,fish]

#map集合
map1: {k1: v1, k2: v2}


